<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8단원 영어 표현 연결 게임</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Arial", sans-serif;
    background: linear-gradient(135deg, #dff6ff, #f8e8ff);
    min-height: 100vh;
    text-align: center;
    color: #333;
}

header {
    padding: 25px 10px 10px;
}

h1 {
    margin: 0;
    font-size: 32px;
    color: #4b4b9b;
}

.subtitle {
    margin-top: 8px;
    color: #666;
}

.info {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin: 15px;
    font-size: 20px;
    font-weight: bold;
}

#game {
    position: relative;
    width: 900px;
    max-width: 95%;
    height: 550px;
    margin: auto;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 30%, white 0 3px, transparent 4px),
        radial-gradient(circle at 70% 20%, white 0 3px, transparent 4px),
        radial-gradient(circle at 40% 80%, white 0 3px, transparent 4px),
        linear-gradient(#91dfff, #d8f5ff);

    border: 5px solid white;
    border-radius: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* 카드 */

.card {
    position: absolute;

    padding: 14px 20px;

    border-radius: 18px;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    user-select: none;

    box-shadow: 0 5px 15px rgba(0,0,0,0.15);

    transition: transform 0.2s, box-shadow 0.2s;
}

.english {
    background: #fff5b8;
    color: #594800;
    border: 3px solid #ffe066;
}

.korean {
    background: #ffd9e8;
    color: #8b3155;
    border: 3px solid #ff9fc2;
}

.card:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* 선택된 카드 */

.selected {
    transform: scale(1.12);
    box-shadow: 0 0 20px #6c63ff;
    border-color: #6c63ff;
}

/* 정답 */

.correct {
    animation: disappear 0.5s forwards;
}

/* 오답 */

.wrong {
    animation: shake 0.4s;
}

@keyframes shake {

    0% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
    100% { transform: translateX(0); }

}

@keyframes disappear {

    to {
        transform: scale(0);
        opacity: 0;
    }

}

/* 시작 화면 */

#startScreen {
    position: absolute;
    inset: 0;

    background: rgba(255,255,255,0.92);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 100;
}

#startScreen h2 {
    font-size: 38px;
    color: #4b4b9b;
}

#startScreen p {
    font-size: 18px;
    line-height: 1.7;
}

button {
    margin-top: 20px;

    padding: 15px 40px;

    border: none;
    border-radius: 30px;

    background: #6c63ff;
    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #554ce6;
    transform: scale(1.05);
}

/* 안내 문구 */

#message {
    height: 35px;
    margin-top: 10px;

    font-size: 18px;
    font-weight: bold;
}

</style>
</head>


<body>

<header>

<h1>🌈 8단원 영어 표현 연결 게임</h1>

<div class="subtitle">
영어 표현과 알맞은 우리말 뜻을 찾아 연결해 보세요!
</div>

</header>


<div class="info">

<div>
점수 ⭐ <span id="score">0</span>
</div>

<div>
남은 표현 📝 <span id="remain">6</span>
</div>

</div>


<div id="message">
영어 표현을 먼저 선택하세요!
</div>


<div id="game">

<div id="startScreen">

<h2>🎈 둥둥 떠다니는 표현을 찾아라!</h2>

<p>
영어 표현 하나를 선택하고<br>
알맞은 한글 뜻을 찾아 클릭하세요.
</p>

<button onclick="startGame()">
게임 시작
</button>

</div>

</div>


<script>

/* =========================
   학습 표현 목록
========================= */

const pairs = [

    {
        english: "long straight hair",
        korean: "긴 생머리"
    },

    {
        english: "blue eyes",
        korean: "파란색 눈"
    },

    {
        english: "brown pants",
        korean: "갈색 바지"
    },

    {
        english: "yellow T-shirt",
        korean: "노란색 티셔츠"
    },

    {
        english: "pink shoes",
        korean: "분홍색 신발"
    },

    {
        english: "short curly hair",
        korean: "짧은 곱슬머리"
    }

];


/* =========================
   게임 변수
========================= */

let score = 0;

let selectedEnglish = null;

let matched = 0;

let gameRunning = false;

let movingCards = [];


/* =========================
   게임 시작
========================= */

function startGame() {

    score = 0;

    matched = 0;

    selectedEnglish = null;

    gameRunning = true;

    document.getElementById("score").textContent = score;

    document.getElementById("remain").textContent = pairs.length;

    document.getElementById("message").textContent =
        "영어 표현을 먼저 선택하세요!";

    document.getElementById("startScreen").style.display = "none";

    createCards();

}


/* =========================
   카드 만들기
========================= */

function createCards() {

    const game = document.getElementById("game");

    movingCards = [];

    pairs.forEach((pair, index) => {

        createCard(
            pair.english,
            "english",
            index
        );

        createCard(
            pair.korean,
            "korean",
            index
        );

    });

}


/* =========================
   카드 생성
========================= */

function createCard(text, type, pairIndex) {

    const game = document.getElementById("game");

    const card = document.createElement("div");

    card.classList.add("card");
    card.classList.add(type);

    card.textContent = text;

    card.dataset.type = type;
    card.dataset.pair = pairIndex;

    /*
       게임 화면 안의 랜덤 위치
    */

    const maxX =
        game.clientWidth - 230;

    const maxY =
        game.clientHeight - 80;

    card.style.left =
        Math.random() * maxX + "px";

    card.style.top =
        50 + Math.random() * (maxY - 50) + "px";


    /*
       움직임 정보
    */

    const movement = {

        element: card,

        x: parseFloat(card.style.left),

        y: parseFloat(card.style.top),

        dx: (Math.random() - 0.5) * 1.5,

        dy: (Math.random() - 0.5) * 1.5

    };

    movingCards.push(movement);


    /*
       클릭 이벤트
    */

    card.addEventListener("click", function() {

        selectCard(card);

    });


    game.appendChild(card);

}


/* =========================
   카드 선택
========================= */

function selectCard(card) {

    if (!gameRunning) return;

    /*
       이미 맞힌 카드 무시
    */

    if (card.classList.contains("correct")) {
        return;
    }


    /*
       영어 표현 선택
    */

    if (card.dataset.type === "english") {

        document
            .querySelectorAll(".english")
            .forEach(c => c.classList.remove("selected"));

        card.classList.add("selected");

        selectedEnglish = card;

        document.getElementById("message").textContent =
            "이 표현의 뜻을 찾아보세요!";

        return;

    }


    /*
       한글을 먼저 누르면 안내
    */

    if (selectedEnglish === null) {

        document.getElementById("message").textContent =
            "먼저 영어 표현을 선택하세요!";

        card.classList.add("wrong");

        setTimeout(() => {
            card.classList.remove("wrong");
        }, 400);

        return;

    }


    /*
       정답 확인
    */

    if (
        selectedEnglish.dataset.pair ===
        card.dataset.pair
    ) {

        correctAnswer(
            selectedEnglish,
            card
        );

    } else {

        wrongAnswer(card);

    }

}


/* =========================
   정답 처리
========================= */

function correctAnswer(english, korean) {

    score++;

    matched++;

    document.getElementById("score").textContent =
        score;

    document.getElementById("remain").textContent =
        pairs.length - matched;


    document.getElementById("message").textContent =
        "🎉 정답이에요!";

    english.classList.add("correct");

    korean.classList.add("correct");

    selectedEnglish = null;


    /*
       모든 문제를 맞힌 경우
    */

    if (matched === pairs.length) {

        setTimeout(endGame, 700);

    }

}


/* =========================
   오답 처리
========================= */

function wrongAnswer(card) {

    document.getElementById("message").textContent =
        "💡 다시 찾아보세요!";

    card.classList.add("wrong");

    selectedEnglish.classList.add("wrong");


    setTimeout(() => {

        card.classList.remove("wrong");

        selectedEnglish.classList.remove("wrong");

    }, 400);

}


/* =========================
   게임 종료
========================= */

function endGame() {

    gameRunning = false;

    const startScreen =
        document.getElementById("startScreen");

    startScreen.style.display = "flex";

    startScreen.innerHTML = `

        <h2>🎉 모두 맞혔어요!</h2>

        <p>
            8단원 핵심 표현을 모두 연결했습니다!<br>
            최종 점수는 <strong>${score}점</strong>입니다.
        </p>

        <button onclick="restartGame()">
            다시 하기
        </button>

    `;

}


/* =========================
   다시 시작
========================= */

function restartGame() {

    document
        .querySelectorAll(".card")
        .forEach(card => card.remove());

    startGame();

}


/* =========================
   둥둥 떠다니는 움직임
========================= */

function animateCards() {

    if (gameRunning) {

        const game =
            document.getElementById("game");

        movingCards.forEach(card => {

            /*
               이미 사라진 카드
            */

            if (
                !document.body.contains(card.element) ||
                card.element.classList.contains("correct")
            ) {
                return;
            }


            card.x += card.dx;

            card.y += card.dy;


            /*
               벽에 닿으면 방향 전환
            */

            const maxX =
                game.clientWidth -
                card.element.offsetWidth;

            const maxY =
                game.clientHeight -
                card.element.offsetHeight;


            if (card.x <= 0 || card.x >= maxX) {

                card.dx *= -1;

            }


            if (card.y <= 40 || card.y >= maxY) {

                card.dy *= -1;

            }


            card.element.style.left =
                card.x + "px";

            card.element.style.top =
                card.y + "px";

        });

    }


    requestAnimationFrame(animateCards);

}


/*
   애니메이션 시작
*/

animateCards();

</script>

</body>
</html>
